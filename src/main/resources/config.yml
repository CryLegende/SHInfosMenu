# ----------------------------------------------------------------#
#                  Configuration de SHInfosMenu                   #
# ----------------------------------------------------------------#
#
# Menu d'informations sur un joueur (grade, temps de jeu, île, argent...), construit avec PlaceholderAPI.
# L'aspect du menu et ses commandes de clic sont dans menu.yml, les textes dans messages.yml.
#
# Commandes :
#   /infos <joueur>         Ouvre le menu d'informations d'un joueur (joueurs seulement).
#   /shinfosmenu reload     Recharge config.yml, menu.yml et messages.yml.
#
# Permissions :
#   shinfosmenu.use            Utiliser /infos (op par défaut, accordée au groupe default).
#   shinfosmenu.admin          Toutes les commandes d'administration (op par défaut).
#   shinfosmenu.admin.reload   /shinfosmenu reload

# Doit-on vérifier si le joueur est en ligne pour ouvrir le menu ?
# Si false, le menu s'ouvrira même pour les joueurs hors ligne (les placeholders fonctionneront quand même).
check-if-online: true

# Liste des joueurs pour qui la commande /infos ne fonctionnera pas.
# Les noms sont sensibles à la casse.
blacklist:
  - "Steve"
  - "Alex"
